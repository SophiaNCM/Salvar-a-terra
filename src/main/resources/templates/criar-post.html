<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar Post</title>
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/criar-post.css}">
</head>
<body>
  <div class="container py-5 d-flex justify-content-center">
    <div class="w-100 card-center">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-4 text-center">Criar nova postagem</h1>

          <form	th:action="${postagem.Id == null} ? @{/posts/CriarPost/save} : @{/posts/editar}" th:object="${postagem}" method="post" enctype="multipart/form-data" novalidate>
			<input type="hidden" th:field="*{id}">
			<input type="hidden"
			           th:name="${_csrf.parameterName}"
			           th:value="${_csrf.token}">
            <div class="mb-3">
              <label for="title" class="form-label">Título</label>
              <input type="text" th:field="*{Titulo}"  class="form-control" placeholder="Título da postagem" required>
            </div>

            <div class="mb-3">
              <label for="content" class="form-label">Conteúdo</label>
              <textarea th:field="*{Conteudo}" class="form-control" rows="8" placeholder="Escreva sua postagem aqui..." required></textarea>
            </div>

            <div class="mb-3">
              <label for="img" class="form-label">Imagem (opcional)</label>
              <input class="form-control" type="file" id="img" name="imagem" accept="image/*">
              <img id="imgPreview" class="img-preview d-none" alt="Pré-visualização">
            </div>

            <div class="mb-3">
              <label for="tags" class="form-label">Tag</label>
              <input type="text" id="tags" th:field="*{Tags}" class="form-control" placeholder="separe por vírgula">
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success">Publicar</button>
			  <a th:href="@{/posts/listar}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
			
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Pré-visualização de imagem
    const imageInput = document.getElementById('image');
    const imgPreview = document.getElementById('imgPreview');
    imageInput?.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) { imgPreview.src = ''; imgPreview.classList.add('d-none'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        imgPreview.src = reader.result;
        imgPreview.classList.remove('d-none');
      };
      reader.readAsDataURL(file);
    });
  </script>

  <script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
