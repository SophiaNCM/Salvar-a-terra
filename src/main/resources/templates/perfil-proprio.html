<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Pessoal</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/perfil-proprio.css}">
</head>
<body>
    <div class="container py-5">
        <div class="profile-card card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex align-items-center gap-4">
                    <div class="text-center">
                        <img th:src="${usuario.ImgUsuario != null ? usuario.ImgUsuario : 'https://via.placeholder.com/130'}" alt="Foto de perfil" class="profile-avatar mb-3">
                    </div>
                    <div class="flex-grow-1">
                        <div class="mb-3">
                            <p class="form-control-plaintext" th:if="${usuario != null}" th:text="${usuario.usuarioNome}"></p>
                            <p class="form-control-plaintext" th:text="${usuario.descricao != null ? usuario.descricao : 'Nada me descreve'}">Descrição do perfil</p>
                        </div>
                        <div class="d-flex gap-2">
                            <a th:href="@{/usuario/editPerfil}" class="btn btn-outline-primary btn-sm">Editar perfil</a>
                            <a th:href="@{../posts/listar}" class="btn btn-secondary btn-sm">Voltar aos posts</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="posts-card card shadow-sm">
            <div class="card-header ">
                <h3 class="h5 mb-0">Seus posts</h3>
                <p class="text-muted mb-0">Aqui estão seus posts publicados.</p>
            </div>
            <div class="list-group list-group-flush" th:each="post : ${posts}">
                <div class="list-group-item">
                    <div class="row align-items-center">
                        <div class="col-md-12">
                            <h5 class="mb-1" th:text="${post.Titulo}"></h5>
                            <p class="mb-1 text-muted" th:text="${post.Conteudo}"></p>
                        </div>
                    </div>
                </div>           
            </div>
        </div>
    </div>

    <script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
