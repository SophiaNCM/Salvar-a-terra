<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
 
  <link rel="stylesheet" th:href="@{/css/login.css}">
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css}" rel="stylesheet">
 

</head>
<body>
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 mx-auto">
        <div class="card border-0 card-center">
          <div class="card-body p-4">

            <form th:action="@{/login}" method="post">
				<div class="text-center mb-4">

					<p class="font-weight-lighter">Seja bem-vindo.</p>
					<p class="text-muted">Realize seu login para continuar</p>					
					<div th:if="${alerta != null}" th:class="${alerta == 'erro'} ? 'alert alert-danger' : 'alert alert-success'"
						 role="alert">
						  <h4 th:text="${titulo}" class="alert-heading">Credenciais...</h4>
						  <p th:text="${texto}">Login ou senha incorretos...</p>
						  <hr>
						  <p class="mb-0"><small th:text="${subtexto}">Acesso permitido...</small></p>
					</div>
				</div>
				
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                  <span class="input-group-text" id="email-addon"><i class="bi bi-envelope"></i></span>
                  <input type="text" id="inputEmail" name="email" class="form-control" placeholder="Digite seu email" aria-label="Email" aria-describedby="email-addon" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <div class="input-group">
                  <span class="input-group-text" id="password-addon"><i class="bi bi-lock"></i></span>
                  <input type="password" id="inputPassword" name="password" class="form-control" placeholder="Digite sua senha" aria-label="Senha" aria-describedby="password-addon" required>
                </div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-dark" id="entrar">Entrar</button>
              </div>
            </form>
            <div class="mt-3">
              <a href="registro.html" class="btn btn-secondary w-100" id="registrar">Criar conta</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
