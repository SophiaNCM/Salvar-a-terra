<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postagens</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/posts.css}"/>
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css}" rel="stylesheet">
</head>
<body>
  <div class="container py-5 d-flex justify-content-center">
    <div class="w-100" style="max-width:820px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex flex-grow-1 justify-content-center px-3">
          <div class="input-group input-group-sm" style="max-width:380px; width:100%;">
            <input type="search" id="search" class="form-control form-control-sm" placeholder="Pesquisar posts" aria-label="Pesquisar">
            <button class="btn btn-secondary btn-sm" type="button"><i class="bi bi-search"></i></button>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <a th:href="@{/usuario/perfil/{id}(id=${usuario.id})}" title="Meu perfil">
			
            <img th:src="${usuario.ImgUsuario != null ? usuario.ImgUsuario : 'https://img.icons8.com/?size=100&id=fUUEbUbXhzOA&format=png&color=000000'}" alt="Foto de perfil" class="rounded-circle border border-2" style="width:48px; height:48px; object-fit:cover;">
          </a>
		 
          <a th:href="@{/posts/CriarPost}" class="btn btn-success border-0 btn-sm"><i class="bi bi-plus-lg me-1"></i>Novo post</a>
		  <form th:action="@{/logout}" method="post">
		  	<button class="btn btn-danger border-0 btn-sm" id="logoutBtn" title="Fazer logout"><i class="bi bi-box-arrow-right" type="submit"></i> Sair</button>
		  </form>
        </div>
      </div>

      <div class="row g-4" th:each="post : ${posts}">
		
	      <!-- Post example 1 -->
	      <div class="col-12">
	        <div class="card post-card h-100 ">
	          <div class="card-body d-flex flex-column">
	            <div class="d-flex align-items-center mb-3">
					<a th:href="@{/usuario/perfil/{id}(id=${post.UsuarioId.Id})}">
		              <img class="me-3 avatar" th:src="${post.UsuarioId.ImgUsuario}" style="width:50px; height:50px; object-fit:cover;"></img>
					  </a>
		              <div>
						<a th:href="@{/usuario/perfil/{id}(id=${post.UsuarioId.Id})}" class="link-perfil">
		                <div class="fw-bold" th:text="${post.UsuarioId.UsuarioNome}">Autor Exemplo</div>
						</a>
		                <small class="text-muted" th:text="${post.PostData}">Publicado em 2026-06-30</small><br>
						<small class="text-muted">Tags: </small>
						<small class="text-muted" th:text=" ${post.Tags}">Qual a tag</small>
						
		              </div>
					
	            </div>
				<a th:href="@{/posts/postIndividual/{id} (id=${post.id})}" class="link-post">
		            <h5 class="card-title" th:text="${post.Titulo}">Título do primeiro post</h5>
		            <p class="card-text" th:text="${post.Conteudo}">Resumo ou trecho da postagem para dar uma ideia do conteúdo.</p>
					<img th:src="${post.ImgURL}" class="w-25 img-fluid mx-auto d-block">
				</a>
	            <div class="mt-auto d-flex justify-content-between align-items-center">
	              <div>
					<button type="button" class="btn btn-danger"  th:id="${'likes-btn-' + post.id}">
						<i class="bi bi-hand-thumbs-up"></i>
						Curtir <span class="badge bg-secondary ms-2" th:id="${'likes-count-' + post.id}" th:text="${post.Likes}">0</span>
					</button>
	                <a href="#" class="btn btn-sm " id="comentario"><i class="bi bi-chat-left"></i> Comentar</a>
	              </div>
	            </div>
	            <div class="card mt-3 d-none" id="comentario-card">
	              <div class="card-body">
					<form th:action="@{/posts/post/{postId}/comentario(postId=${post.id})}" th:object="${comentario}" method="post" enctype="multipart/form-data">
		                <h6 class="card-title mb-3">Escrever comentário</h6>
		                <div class="mb-3">
		                  <textarea class="form-control" id="Conteudo" name="Conteudo" rows="4" placeholder="Escreva seu comentário..."></textarea>
		                </div>
						<div class="mb-3">
						   <label for="comentario-img" class="form-label small mb-2">Foto do comentário (opcional)</label>
						   <input class="form-control form-control-sm" type="file" id="imgComentario" name="imgComentario" accept="image/*">
						   <div id="comentarioImgPreview" class="mt-2 d-none">
						   		<img src="" alt="Pré-visualização da foto do comentário" class="img-fluid rounded" style="max-height: 140px; object-fit: cover;">
						</div>
						</div>
		                <div class="d-flex justify-content-end gap-2">
		                  <button class="btn btn-secondary btn-sm" type="button" id="cancelar">Cancelar</button>
		                  <button class="btn btn-primary btn-sm" type="submit" id="enviar">Enviar comentário</button>
		                </div>
					</form>	
	              </div>
	            </div>
	          </div>
	        </div>
	      </div>
      </div>
    </div>
  </div>
  <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
  <script th:src="@{/js/likes.js}" th:fragment="js"></script>
  <script type="text/javascript" th:src="@{/js/posts.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
