<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title th:text="${post.Titulo}">Post</title>
	<!-- Bootstrap CSS (CDN) -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Optional: Bootstrap Icons -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<!-- CSS local (sirva em /css/postUnico.css) -->
	<link th:href="@{/css/postUnico.css}" href="css/postUnico.css" rel="stylesheet">
</head>
<body>
	<main class="container py-4">
		<div class="row justify-content-center">
			<div class="col-12 col-md-10">
				<article class="card shadow-sm">
					<div class="card-body">
						<div class="d-flex align-items-center mb-3">
							<img th:src="${post.UsuarioId.ImgUsuario} ?: 'https://i.pravatar.cc/80?img=3'" alt="Avatar" class="rounded-circle me-3 avatar-sm" />
							<div>
								<div class="fw-semibold" th:text="${post.UsuarioId.UsuarioNome}">Autor</div>
								<small class="text-muted" th:text="${post.PostData}">DATA</small>
							</div>
						</div>

						<h1 class="card-title h3 mb-2" th:text="${post.Titulo}">Título do Post</h1>
						<small class="text-muted">Tags:</small>
						<small class="text-muted" th:text="${post.Tags}">Tag</small>
						<div class="card-text mb-3" th:utext="${post.Conteudo}">
							<!-- Conteúdo HTML do post (renderizado server-side) -->
						</div>

						<div class="post-image mb-3">
							<img th:src="${post.ImgURL} ?: 'https://picsum.photos/800/400?random=3'" class="card-img-top img-fluid w-25" alt="Imagem do post" />
						</div>

						<div class="d-flex align-items-center gap-2 mb-3">
							<form th:action="@{/posts/{id}/like(id=${post.id})}" method="post">
								<!-- Se usar Spring Security, inclua o token CSRF: -->
								<!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/> -->
								<button type="submit" class="btn btn-danger">
									<i class="bi bi-hand-thumbs-up"></i>
									Curtir <span class="badge bg-secondary ms-2" th:text="${post.likes}">0</span>
								</button>
							</form>
						</div>

						<section class="comments">
							<h2 class="h5">Comentários <span class="badge bg-secondary" th:text="${#lists.size(post.comentario)}">0</span></h2>

							<ul class="list-group list-group-flush mb-3">
								<li class="list-group-item p-2" th:each="comentario : ${post.Comentario}">
									<div class="d-flex align-items-start gap-2 comment-card">
										<img th:src="${comentario.UsuarioId.ImgUsuario} ?: 'https://img.icons8.com/?size=100&id=fUUEbUbXhzOA&format=png&color=000000'" alt="avatar" class="rounded-circle me-2 avatar-sm" />
										<div class="flex-fill">
											<div class="fw-semibold small mb-1" th:text="${comentario.UsuarioId.UsuarioNome}">Nome</div>
											<div class="small mb-1" th:text="${comentario.Conteudo}">Comentário</div>
											<img th:if="${comentario.ImgURL}" th:src="${comentario.ImgURL}" class="img-fluid rounded comment-img" alt="imagem do comentário" />
										</div>
									</div>
								</li>
								<li class="list-group-item text-muted" th:if="${post.comentario.size() == 0}">Nenhum comentário ainda.</li>
							</ul>

							<form th:action="@{/posts/post/{postId}/comentario(postId=${post.id})}" th:object="${comentario}" method="post" enctype="multipart/form-data" class="row g-2">
								<!-- Inclua CSRF se necessário -->
								<div class="col-12">
									<label class="form-label visually-hidden">Comentário</label>
									<textarea class="form-control" placeholder="Escreva um comentário" id="Conteudo" name="Conteudo"></textarea>
								</div>
								<div class="mb-3">
						   			<label for="comentario-img" class="form-label small mb-2">Foto do comentário (opcional)</label>
						   			<input class="form-control form-control-sm" type="file" id="imgComentario" name="imgComentario" accept="image/*">
						   			<div id="comentarioImgPreview" class="mt-2 d-none">
						   				<img src="" alt="Pré-visualização da foto do comentário" class="img-fluid rounded" style="max-height: 140px; object-fit: cover;">
									</div>
								</div>
								<div class="col-12 text-end">
									<button type="submit" class="btn btn-primary">Enviar comentário</button>
								</div>
							</form>
						</section>
					</div>
				</article>
			</div>
		</div>
	</main>

</body>
</html>
