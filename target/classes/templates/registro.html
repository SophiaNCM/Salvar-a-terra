<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" th:href="@{css/registro.css}">
  <link th:href="{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css}" rel="stylesheet">

</head>
<body>
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 mx-auto">
        <div class="card border-0 card-center">
          <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center">Registrar</h1>
            <form action="/registro" method="post">
              <div class="mb-3">
                <label for="name" class="form-label">Nome</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" id="name" name="name" class="form-control" placeholder="Digite seu nome completo" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="birthdate" class="form-label">Data de nascimento</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-calendar-date"></i></span>
                  <input type="date" id="birthdate" name="birthdate" class="form-control" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="email" name="email" class="form-control" placeholder="Digite seu email" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" id="password" name="password" class="form-control" placeholder="Escolha uma senha" required>
                </div>
              </div>
              <div class="d-grid gap-2">
                <button type="submit" class="btn" id="registrar">Registrar</button>
                <a href="login.html" class="btn" id="entrar">Entrar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
