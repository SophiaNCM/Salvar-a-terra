<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/editar-perfil.css}">
</head>
<body>
    <div class="container py-5">
        <div class="profile-card card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex align-items-center gap-4">
                    
                    </div>
                    <div class="flex-grow-1">
                        <h2 class="h4 mb-1">Editar perfil</h2>
                        <p class="text-muted mb-4">Atualize seu nome e controle seus posts publicados.</p>
                        <div class="border rounded p-3 bg-light mb-4">
                            <strong>Pré-visualização</strong>
                            <p class="mb-1">Nome: <span id="previewName" th:text="${usuario.usuarioNome}">João Silva</span></p>
                            <p class="mb-0">Descrição: <span id="previewDescription" th:text="${usuario.descricao}">Desenvolvedor web e criador de conteúdo.</span></p>
                        </div>
                        <form method="post"  enctype="multipart/form-data" th:action="@{/usuario/editPerfil/save}" th:object="${usuario}">
							<div class="container">
								<div class="row">
								<div class="col align-self-start">
										<div >
										<img th:src="${usuario.imgUsuario != null ? usuario.imgUsuario  : 'https://via.placeholder.com/130'}" alt="Foto de perfil" class="profile-avatar mb-3">
										<div>
										    <label class="btn btn-outline-primary btn-sm mb-0">
										        Alterar foto
										        <input name="imgUsuario" type="file" accept="image/*" class="d-none">
										    </label>
										</div>
									</div>
								</div>
								<div class="col-8 align-self-end">
		                            <div >
		                                <label for="nome" class="form-label">Nome</label>
		                                <input type="text" class="form-control" placeholder="Digite seu nome"  th:field="*{usuarioNome}">
		                            </div>
			                            <div class="">
			                                <label for="descrição" class="form-label">Descrição do perfil</label>
			                                <textarea th:field="*{descricao}"class="form-control" rows="3" placeholder="Digite uma descrição breve"></textarea>
			                            </div>
										<button type="submit" class="btn btn-primary">Salvar alterações</button>
									</div>
								</div>
								</div>
	                            
							
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="posts-card card shadow-sm">
            <div class="card-header">
                <h3 class="h5 mb-0">Seus posts</h3>
                <p class="text-muted mb-0">Edite ou exclua seus posts diretamente daqui.</p>
            </div>
            <div class="list-group list-group-flush" th:each="post : ${posts}">
                <div class="list-group-item">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h5 class="mb-1"  th:text="${post.Titulo}">Meu primeiro post</h5>
                            <p class="mb-1 text-muted" th:text="${post.Conteudo}">Compartilhando novidades importantes sobre meu projeto.</p>
                        </div>
                        <div class="col-md-4 text-md-end mt-3 mt-md-0">
                            <button class="btn btn-outline-secondary btn-sm me-2"><a th:href="@{/posts/editar/{id}(id=${post.id})}" style="text-decoration: none; color: black;">Editar</a></button>
                            <button class="btn btn-outline-danger btn-sm"><a th:href="@{/posts/excluir/{id}(id=${post.id})}" style="text-decoration: none; color: black;">Excluir</a></button>
							</form>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    <script>
        const userNameInput = document.getElementById('userName');
        const previewName = document.getElementById('previewName');
        const descriptionInput = document.getElementById('profileDescription');
        const previewDescription = document.getElementById('previewDescription');
        const photoInput = document.getElementById('photoInput');
        const profileImage = document.getElementById('profileImage');

        userNameInput.addEventListener('input', () => {
            previewName.textContent = userNameInput.value || 'Seu nome aparecerá aqui';
        });

        descriptionInput.addEventListener('input', () => {
            previewDescription.textContent = descriptionInput.value || 'Sua descrição aparecerá aqui';
        });

        photoInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                profileImage.src = reader.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
    <script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
